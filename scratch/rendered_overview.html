<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin Login - Claretian</title>
    <link rel="icon" type="image/png" sizes="16x16" href="http://127.0.0.1:8000/images/claeritian_logo.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Line Awesome Icons -->
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    
    <link rel="stylesheet" href="http://127.0.0.1:8000/css/login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="decorative-background">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
        
        <div class="login-card">
            <!-- Left Panel - Logo and Branding -->
            <div class="card-left">
                <div class="logo-wrapper">
                    <img src="http://127.0.0.1:8000/images/claeritian_logo.png" alt="Claretian Logo" class="logo">
                </div>
                <h1 class="brand-title">Claretian Publications</h1>
                <p class="brand-subtitle">Superadmin Portal</p>
            </div>

            <!-- Right Panel - Login Form -->
            <div class="card-right">
                
                <form action="http://127.0.0.1:8000/login" method="POST" class="login-form">
                    <input type="hidden" name="_token" value="Xu3pbXQhbMMnOqBzPeDcnkmVcbGzYxXB35v1fjaD">                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="las la-envelope"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Enter your email"
                                value=""
                                required
                                autofocus
                            >
                        </div>
                                            </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="las la-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="las la-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                                            </div>

                    <button type="submit" class="btn-login">
                        <span>Sign In</span>
                        <i class="las la-arrow-right"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <p>&copy; 2026 Claretian Publications. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('la-eye');
                toggleIcon.classList.add('la-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('la-eye-slash');
                toggleIcon.classList.add('la-eye');
            }
        }

        // Add smooth entrance animation
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.login-card').classList.add('loaded');
        });
    </script>
</body>
</html>
